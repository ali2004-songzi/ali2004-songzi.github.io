<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大蓝闪蝶 | 3D 数字标本馆</title>
    
    <!-- 引入 model-viewer 组件 -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-color: #00bcd4; /* 科技蓝 */
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* --- 导航与头部 --- */
        nav { padding: 20px 50px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; color: var(--accent-color); }
        header { text-align: center; padding: 60px 20px; }
        header h1 { font-family: var(--font-serif); font-weight: normal; margin: 0; }
        header p { color: var(--text-muted); margin-top: 10px; }

        /* --- 3D 标本网格 --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        .specimen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); /* 卡片最小宽度增加 */
            gap: 50px;
        }

        /* --- 3D 卡片设计 --- */
        .specimen-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .specimen-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }

        /* 3D 查看器容器 */
        .model-container {
            width: 100%;
            height: 400px; /* 3D模型展示高度 */
            background-color: #181818;
            position: relative;
            background-image: radial-gradient(#333 1px, transparent 1px); /* 网格背景 */
            background-size: 20px 20px;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* 信息区域 */
        .card-content { padding: 30px; }
        
        .scientific-name {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--accent-color);
            font-size: 1.2rem;
            display: block;
            margin-bottom: 5px;
        }

        .common-name { margin: 0 0 15px 0; font-family: var(--font-serif); font-size: 1.6rem; }
        
        .taxonomy-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: block;
        }

        .description { color: #ccc; margin-bottom: 25px; font-size: 0.95rem; }

        .meta-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .meta-item strong { display: block; color: #fff; font-size: 0.85rem; margin-bottom: 4px; }
        .meta-item span { color: var(--text-muted); font-size: 0.85rem; }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .specimen-grid { grid-template-columns: 1fr; }
            .model-container { height: 300px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">DIGITAL MUSEUM</div>
        <div class="nav-links">
            <a href="#" style="color: #fff;">收藏集</a>
        </div>
    </nav>

    <header>
        <h1>3D 数字标本档案</h1>
        <p>交互式浏览 · 毫米级精度 · 永久保存</p>
    </header>

    <main class="container">
        <div id="specimen-container" class="specimen-grid">
            <!-- 内容将由 JS 生成 -->
        </div>
    </main>

    <script>
        // --- 数据源配置 ---
        const specimens = [
            {
                id: 1,
                commonName: "大蓝闪蝶",
                scientificName: "Morpho menelaus",
                taxonomy: "鳞翅目 · 蛱蝶科",
                
                // ⚠️ 重点：这里填写你的 3D 模型文件路径 (.glb 或 .gltf)
                // 如果没有文件，这里暂时放了一个示例模型链接
                modelSrc: "c7613296165f80369f132eb6c53b2f5b_tennak.glb", 
                
                // 这里是鼠标悬停时显示的静态图片（可选，加载模型前显示）
                posterImage: "your-image-path.jpg", 
                
                description: "大蓝闪蝶是闪蝶属中体型最大的物种之一。通过3D扫描技术，我们完整保留了其翅膀的立体结构色和标本针的插针位置。你可以360度旋转观察其腹面的眼斑细节。",
                story: "属名“Morpho”源自希腊语，意为“美丽”。",
                location: "巴西亚马逊",
                date: "2025.11.12",
                size: "135mm (翅展)"
            },
            // 你可以在这里添加更多标本...
        ];

        // --- 渲染逻辑 ---
        const container = document.getElementById('specimen-container');

        specimens.forEach(item => {
            const card = document.createElement('article');
            card.className = 'specimen-card';
            
            card.innerHTML = `
                <div class="model-container">
                    <!-- 
                       model-src: 你的3D模型地址
                       camera-controls: 允许鼠标拖拽旋转
                       touch-action: 允许手机触控
                       shadow-intensity: 阴影强度
                       exposure: 曝光度
                       auto-rotate: 自动旋转展示
                    -->
                    <model-viewer 
                        src="${item.modelSrc}" 
                        poster="${item.posterImage || ''}"
                        alt="3D模型：${item.commonName}"
                        camera-controls 
                        touch-action="pan-y"
                        shadow-intensity="1"
                        exposure="1"
                        environment-image="neutral"
                        auto-rotate
                        rotation-per-second="30deg"
                        ar
                        ar-modes="webxr scene-viewer quick-look"
                    >
                        <!-- 这里的按钮会在支持AR的设备上显示 -->
                        <button slot="ar-button" style="background-color: white; color: black; border: none; position: absolute; bottom: 16px; right: 16px; padding: 10px; border-radius: 4px;">
                            👋 查看增强现实
                        </button>
                    </model-viewer>
                </div>

                <div class="card-content">
                    <span class="scientific-name">${item.scientificName}</span>
                    <h2 class="common-name">${item.commonName}</h2>
                    <span class="taxonomy-tag">${item.taxonomy}</span>
                    
                    <p class="description">${item.description}</p>
                    <p style="font-style: italic; color: #888; font-size: 0.9rem; margin-top: -15px; margin-bottom: 25px;">"${item.story}"</p>
                    
                    <div class="meta-data">
                        <div class="meta-item"><strong>采集地</strong><span>${item.location}</span></div>
                        <div class="meta-item"><strong>采集日</strong><span>${item.date}</span></div>
                        <div class="meta-item"><strong>标本尺寸</strong><span>${item.size}</span></div>
                    </div>
                </div>
            `;
            
            container.appendChild(card);
        });
    </script>
</body>
</html>
