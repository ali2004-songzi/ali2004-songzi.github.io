<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大蓝闪蝶 | 生物标本档案</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-color: #4db6ac; /* 标本蓝绿色调 */
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        a:hover { color: var(--accent-color); }

        /* --- 导航栏 --- */
        nav {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; }
        .nav-links a { margin-left: 20px; font-size: 0.9rem; text-transform: uppercase; }

        /* --- 头部 --- */
        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, #1a1a1a, #121212);
        }
        header h1 { margin: 0; font-family: var(--font-serif); font-weight: normal; }
        header p { color: var(--text-muted); margin-top: 10px; }

        /* --- 标本网格布局 --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .specimen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

        /* --- 标本卡片设计 --- */
        .specimen-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .specimen-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--accent-color);
        }

        .image-container {
            width: 100%;
            height: 300px;
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保持图片比例填充 */
            transition: transform 0.5s ease;
        }

        .specimen-card:hover .image-container img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .scientific-name {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--accent-color);
            font-size: 1.1rem;
            margin-bottom: 5px;
            display: block;
        }

        .common-name {
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            font-family: var(--font-serif);
        }

        .taxonomy-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .description {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .details-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #181818;
            padding: 15px;
            border-radius: 4px;
        }

        .details-list li {
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        .details-list span { color: #fff; }

        /* --- 页脚 --- */
        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid #333;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- 导航 -->
    <nav>
        <div class="logo">NATURALIS</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">收藏系列</a>
            <a href="#">关于我</a>
        </div>
    </nav>

    <!-- 头部 -->
    <header>
        <h1>生物标本收藏集</h1>
        <p>探索自然之美，定格永恒瞬间</p>
    </header>

    <!-- 主要内容区域 -->
    <main class="container">
        <div id="specimen-container" class="specimen-grid">
            <!-- 标本卡片将通过 JavaScript 自动插入到这里 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2026 生物标本收藏集。保留所有权利。</p>
    </footer>

    <!-- 逻辑脚本 -->
    <script>
        // 1. 数据源：在这里添加你的标本信息
        const specimens = [
            {
                id: 1,
                commonName: "大蓝闪蝶",
                scientificName: "Morpho menelaus",
                taxonomy: "鳞翅目 / 蛱蝶科 / 闪蝶属",
                // 这里使用了一个占位图，请替换为您自己的标本照片路径，例如 'images/butterfly.jpg'
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Morpho_menelaus_huebneri_MHNT.jpg/800px-Morpho_menelaus_huebneri_MHNT.jpg", 
                description: "大蓝闪蝶，又名蓝摩尔福蝶、蓝色妖姬，是鳞翅目蛱蝶科闪蝶属中体型最大的物种之一。其翅膀闪耀着金属般的蓝色光泽，这种结构色并非来自色素，而是源于翅膀鳞片的纳米级物理结构对光线的干涉。",
                story: "属名“Morpho”源自希腊语，是爱与美之神阿芙洛狄蒂的称号，寓意“美丽”。",
                location: "巴西亚马逊",
                date: "2025.11.12",
                width: "135mm"
            },
            // 您可以在这里复制上面的块来添加更多标本
            // {
            //     commonName: "下一个标本...",
            //     ...
            // }
        ];

        // 2. 渲染函数：将数据转换为 HTML
        const container = document.getElementById('specimen-container');

        specimens.forEach(item => {
            const card = document.createElement('article');
            card.className = 'specimen-card';
            
            card.innerHTML = `
                <div class="image-container">
                    <img src="${item.image}" alt="${item.commonName}">
                </div>
                <div class="card-content">
                    <span class="scientific-name">${item.scientificName}</span>
                    <h2 class="common-name">${item.commonName}</h2>
                    <div class="taxonomy-tag">${item.taxonomy}</div>
                    
                    <p class="description">${item.description}</p>
                    <p class="description" style="font-size: 0.9rem; color: #888; font-style: italic;">"${item.story}"</p>
                    
                    <ul class="details-list">
                        <li>采集地 <span>${item.location}</span></li>
                        <li>采集日期 <span>${item.date}</span></li>
                        <li>翅展 <span>${item.width}</span></li>
                    </ul>
                </div>
            `;
            
            container.appendChild(card);
        });
    </script>
</body>
</html>
